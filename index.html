<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Batch Image Converter</title>
  <style>
    :root { --bg:#0b0d10; --panel:#141821; --text:#e7ebf0; --muted:#8fa0b3; --brand:#4da3ff; --ok:#22c55e; --warn:#f59e0b; }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font:14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Inter, "Helvetica Neue", Arial, sans-serif;background:linear-gradient(180deg,#0b0d10,#0a0c0f 40%,#0b0d10);color:var(--text)}
    .container{max-width:1100px;margin:32px auto;padding:0 16px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-size:22px;margin:0;letter-spacing:.2px}
    .tag{padding:4px 8px;border-radius:999px;background:rgba(77,163,255,.12);color:#cfe5ff;border:1px solid rgba(77,163,255,.25)}
    .grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}
    .card{background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.08);backdrop-filter: blur(8px);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
    .card h2{margin:0 0 10px 0;font-size:15px;color:#d6dbe3}
    .card .body{padding:14px}
    .drop{border:1.5px dashed rgba(255,255,255,.18);border-radius:12px;padding:18px;text-align:center;cursor:pointer;background:rgba(255,255,255,.02)}
    .drop.drag{border-color:var(--brand);background:rgba(77,163,255,.08)}
    .muted{color:var(--muted)}
    .files{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}
    .thumb{position:relative;border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden;background:#0f131a}
    .thumb img{display:block;width:100%;height:140px;object-fit:cover}
    .thumb .meta{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;color:#c7d2de;font-size:12px}
    .chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    label{display:block;font-size:12px;color:#c7d2de;margin-bottom:6px}
    select,input[type="number"],input[type="text"],input[type="range"]{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#0e1218;color:#e6ecf5}
    input[type="range"]{padding:0;height:34px}
    .help{font-size:12px;color:var(--muted);margin-top:6px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
    button{padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:#0e131a;color:#eaf2ff;cursor:pointer}
    .primary{background:linear-gradient(180deg,#1f6fff,#1b5ae0);border-color:#245fe7}
    .good{background:linear-gradient(180deg,#22c55e,#179d49);border-color:#169a47}
    .ghost{background:transparent}
    .danger{background:linear-gradient(180deg,#ef4444,#dc2626);border-color:#dc2626}
    .progress{height:10px;border-radius:999px;background:#0f131a;border:1px solid rgba(255,255,255,.12);overflow:hidden}
    .bar{height:100%;width:0;background:linear-gradient(90deg,#1f6fff,#22c55e)}
    .footer{margin-top:14px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12px}
    .pill{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div style="display:flex;gap:10px;align-items:center">
        <h1>Batch Image Converter</h1>
        <span class="tag">PNG • JPG • WEBP • GIF • BMP • SVG • HEIC → PNG/JPG/WEBP</span>
      </div>
      <div class="pill" id="countLabel">0 files</div>
    </header>

    <!-- same UI structure as before -->
  </div>

<script>
(function(){
  const SUPPORTED_IN = ['image/png','image/jpeg','image/webp','image/gif','image/bmp','image/svg+xml','image/heic','image/heif'];
  const EXT_MAP = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp':'webp' };

  // ... rest of variables as before

  async function decodeToBitmap(file){
    if (file.type==='image/heic' || file.type==='image/heif' || file.name.toLowerCase().endsWith('.heic') || file.name.toLowerCase().endsWith('.heif')){
      try {
        const arrayBuffer = await file.arrayBuffer();
        // Try native support first
        return await createImageBitmap(new Blob([arrayBuffer], {type: file.type || 'image/heic'}));
      } catch(err){
        alert('HEIC/HEIF decoding is not supported by this browser. Please use Safari/iOS or convert with a different tool.');
        throw err;
      }
    }
    try { return await createImageBitmap(file); }
    catch(err){
      const url = URL.createObjectURL(file);
      try{ const img = await loadImage(url); return imgToBitmap(img); }
      finally{ URL.revokeObjectURL(url); }
    }
  }

  function loadImage(url){
    return new Promise((res,rej)=>{ const img = new Image(); img.onload=()=>res(img); img.onerror=rej; img.src=url; });
  }
  function imgToBitmap(img){
    const cvs=document.createElement('canvas');
    cvs.width=img.naturalWidth||img.width; cvs.height=img.naturalHeight||img.height;
    const ctx=cvs.getContext('2d');
    ctx.drawImage(img,0,0);
    return createImageBitmap(cvs);
  }

  // rest of code unchanged from previous version
})();
</script>
</body>
</html>
